name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Web App with Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract application ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="./Beresin-custom-auth-v6-order-central-fixed (1).zip"
          test -f "$ZIP_FILE"
          mkdir -p temp_extracted
          unzip -o -q "$ZIP_FILE" -d temp_extracted
          ZIP_PKG=$(find temp_extracted -type f -name "package.json" | head -n 1)
          test -n "$ZIP_PKG"
          SRC_DIR=$(dirname "$ZIP_PKG")
          shopt -s dotglob
          cp -rf "$SRC_DIR"/* .
          rm -rf temp_extracted
          test -f package.json
          test -f src/lib/supabase.ts
          test -f src/components/OrderModal.tsx

      - name: Apply Beresin order flow source patch
        run: python3 scripts/apply-order-flow-fix.py

      - name: Apply lifecycle and notification source patch
        run: python3 scripts/apply-lifecycle-notification-fix.py

      - name: Apply central payment settings source patch
        run: python3 scripts/apply-payment-config-fix.py

      - name: Validate central order, lifecycle, and payment settings flow
        run: |
          set -euo pipefail
          grep -q "custom_create_order" src/lib/supabase.ts
          grep -q "createRemoteOrder" src/lib/supabase.ts
          grep -q "getRemoteOrders" src/lib/supabase.ts
          grep -q "custom_order_action" src/lib/supabase.ts
          grep -q "getNotifications" src/lib/supabase.ts
          grep -q "custom_get_payment_config" src/lib/supabase.ts
          grep -q "custom_save_payment_config" src/lib/supabase.ts
          grep -q "loadPaymentConfig" src/lib/supabase.ts
          grep -q "MENUNGGU_PEMBAYARAN" src/App.tsx
          grep -q "081224405119" src/lib/supabase.ts
          grep -q "Hesti Kurnia" src/lib/supabase.ts
          grep -q "628136732365" src/lib/supabase.ts
          if grep -R -n --exclude-dir=node_modules --exclude-dir=.git -E "08136732365|887012345678|BERESIN JASA" src; then
            echo "ERROR: legacy payment/contact values remain in source"
            exit 1
          fi
          echo "OK: central order, lifecycle, notification, bank, WhatsApp, and payment flows are present with no retired values"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Validate Type Check
        run: npm run lint

      - name: Build Vite with Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          python3 - <<'PY'
          from pathlib import Path
          import re
          version = "${{ github.sha }}"
          for name in ("index.html", "404.html"):
              p = Path("dist") / name
              if not p.exists():
                  if name == "404.html":
                      continue
                  raise SystemExit(f"missing {p}")
              s = p.read_text()
              s = re.sub(r'(src="/Beresin-/assets/[^"?]+\.js)(")', rf'\1?v={version}\2', s)
              s = re.sub(r'(href="/Beresin-/assets/[^"?]+\.css)(")', rf'\1?v={version}\2', s)
              s = s.replace("</head>", '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"></head>')
              p.write_text(s)
          Path("dist/404.html").write_text(Path("dist/index.html").read_text())
          PY

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
