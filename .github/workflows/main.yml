name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Web App with Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract and validate application ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Repository contents ==="
          ls -la

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: application ZIP not found"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          mkdir -p temp_extracted
          unzip -o -q "$ZIP_FILE" -d temp_extracted

          ZIP_PKG=$(find temp_extracted -type f -name "package.json" | head -n 1)
          if [ -z "$ZIP_PKG" ]; then
            echo "ERROR: package.json not found inside application ZIP"
            exit 1
          fi

          SRC_DIR=$(dirname "$ZIP_PKG")
          shopt -s dotglob
          cp -rf "$SRC_DIR"/* .
          rm -rf temp_extracted

          test -f package.json
          test -f src/lib/supabase.ts
          test -f src/components/OrderModal.tsx
          grep -q "custom_create_order" src/lib/supabase.ts
          grep -q "createRemoteOrder" src/lib/supabase.ts
          grep -q "getRemoteOrders" src/lib/supabase.ts
          echo "OK: central Supabase order flow is present"

      - name: Apply source compatibility patches
        run: node scripts/patch-order-service-alias.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Validate Type Check
        run: npm run lint

      - name: Build Vite with Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
